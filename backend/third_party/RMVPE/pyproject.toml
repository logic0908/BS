[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rmvpe"
version = "0.1.0"
description = "RMVPE: A Robust Model for Vocal Pitch Estimation in Polyphonic Music"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "RMVPE Contributors"}
]
keywords = ["pitch estimation", "music information retrieval", "deep learning", "audio processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "librosa>=0.9.0",
    "tqdm>=4.50.0",
    "scipy>=1.5.0",
    "pandas>=1.3.0",
    "mir_eval>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/Dream-High/RMVPE"
Repository = "https://github.com/Dream-High/RMVPE"

[project.scripts]
rmvpe = "rmvpe.cli:main"

[tool.setuptools]
packages = ["rmvpe"]

[tool.setuptools.package-data]
rmvpe = ["py.typed"]

